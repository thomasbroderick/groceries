spring.application.name=groceries
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/groceries
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
kroger.redirect-uri=http://localhost:8080/api/kroger/auth/callback
app.jwt.secret=dev-secret-change-this-in-prod-must-be-at-least-32-chars
app.jwt.expiration-seconds=2592000
app.base-url=/
google.api.key=${GEMINI_API_KEY:}
